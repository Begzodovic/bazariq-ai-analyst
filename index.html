const knownRU={"Hudud":"Регион","Broker":"Брокер","Broker nomi":"Название брокера","Tovar":"Товар","Sana":"Дата","Mutlaq farq":"Абсолютная разница","Farq (ta)":"Разница (шт.)","Foiz o‘zgarishi (%)":"Изменение (%)","O‘zgarish (%)":"Изменение (%)","O‘zgarish (foiz punkt)":"Изменение (п.п.)","2024-yil ulushi (%)":"Доля за 2024 год (%)","2025-yil ulushi (%)":"Доля за 2025 год (%)","Toshkent shahri":"город Ташкент","Toshkent viloyati":"Ташкентская область","Namangan viloyati":"Наманганская область","Buxoro viloyati":"Бухарская область","Samarqand viloyati":"Самаркандская область","Andijon viloyati":"Андижанская область","Farg‘ona viloyati":"Ферганская область","Navoiy viloyati":"Навоийская область","Xorazm viloyati":"Хорезмская область","Qashqadaryo viloyati":"Кашкадарьинская область","Surxondaryo viloyati":"Сурхандарьинская область","Jizzax viloyati":"Джизакская область","Sirdaryo viloyati":"Сырдарьинская область","Qoraqalpog‘iston Respublikasi":"Республика Каракалпакстан"};
const knownUZ=Object.fromEntries(Object.entries(knownRU).map(([k,v])=>[v,k]));
function quickLabel(value,target){if(typeof value!=="string")return value;
 const gloss=target==="ru"?knownRU:knownUZ;
 if(gloss[value])return gloss[value];
 if(target==="ru")return value.replace(/(20\d\d)-yil/g,"$1 год").replace(/bitimlar soni/gi,"количество сделок").replace(/bekor qilingan/gi,"отменённые сделки").replace(/ulushi/gi,"доля").replace(/foiz punkt/gi,"п.п.");
 return value.replace(/(20\d\d) год/g,"$1-yil").replace(/Количество сделок/gi,"Bitimlar soni").replace(/Отменённые сделки/gi,"Bekor qilingan bitimlar");
}
function labelsFrom(r){
 const found=new Set();
 for(const record of (r.rows||[]).slice(0,100))for(const val of Object.values(record)){
  if(typeof val==="string"&&val.length<=140&&/[A-Za-zА-Яа-яЁёЎўҒғҚқҲҳ]/.test(val)&&!/^(?:[A-Z0-9_-]{2,}|\d+[./:-]\d+)$/.test(val))found.add(val);
  if(found.size>=80)return [...found];
 }
 return [...found];
}
function localized(r){return r.localized?.[lang]||null}
function table(r){const outer=node("div","table-scroll"),tab=node("table"),translation=localized(r);
 const header=tab.createTHead().insertRow();
 for(let i=0;i<r.columns.length;i++){const col=r.columns[i];header.append(node("th","",translation?.columns?.[i]||quickLabel(col,lang)))}
 const labels=translation?.labels||[];const originalLabels=labelsFrom(r);
 const labelMap=new Map(originalLabels.map((v,i)=>[v,labels[i]||quickLabel(v,lang)]));
 const body=tab.createTBody();for(const item of r.rows){const tr=body.insertRow();for(const col of r.columns){const v=item[col];tr.insertCell().textContent=typeof v==="string"?(labelMap.get(v)||quickLabel(v,lang)):(v??"—")}}
 outer.append(tab);return outer}
const translatingChats=new Set();
async function translateVisible(){
 const c=active,target=lang,key=c.id+":"+target;if(translatingChats.has(key))return;
 const pending=c.turns.filter(t=>["ok","clarify"].includes(t.result?.status)&&t.result.lang!==target&&!t.result.localized?.[target]);
 if(!pending.length)return;
 translatingChats.add(key);
 try{
  // One request translates text, column names and row labels without querying the registry again.
  for(let start=0;start<pending.length;start+=8){const batch=pending.slice(start,start+8);
   const items=batch.map(t=>({answer:String(t.result.answer||""),columns:t.result.columns||[],labels:labelsFrom(t.result)}));
   const resp=await fetch("/api/translate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lang:target,items})});
   if(!resp.ok)throw new Error("translation request failed: "+resp.status);
   const data=await resp.json();if(!Array.isArray(data.items)||data.items.length!==batch.length)throw new Error("invalid translation response");
   batch.forEach((t,i)=>{t.result.localized=t.result.localized||{};t.result.localized[target]=data.items[i]});
   save();if(active===c&&lang===target)renderMessages();
  }
 }catch(err){if(active===c&&lang===target){
  for(const t of pending)if(!t.result.localized?.[target])t.translationFailed=target;
  renderMessages();
 }}finally{translatingChats.delete(key)}
}
function prepareFreshQuestion(question,sourceChat){
 const q=String(question||"");
 const reference=/(?:^|[^\p{L}])(shu|shular|oldingi|avvalgi|endi|ular|ushbu|этих|эти|этого|предыдущ|теперь|те же|those|previous|same)(?=$|[^\p{L}])/iu.test(q);
 if(!reference)return q.slice(0,1500);
 const prior=[...sourceChat.turns].reverse().find(x=>x.result?.status==="ok"&&Array.isArray(x.result.rows)&&x.result.rows.length>0);
 if(!prior)return q.slice(0,1500);
 const result=prior.result;
 const rows=result.rows.slice(0,20);
 const selected=[];
 const nameCol=Object.keys(rows[0]||{}).find(k=>/hudud|region|регион|broker|брокер|nomi|name|товар|tovar|mahsulot/i.test(k) && rows.every(r=>typeof r[k]==="string"));
 if(nameCol){for(const row of rows){if(row[nameCol]&&!selected.includes(row[nameCol]))selected.push(row[nameCol]);}}
 const codes=Array.isArray(result.selected_set)?result.selected_set.filter(x=>typeof x==="string"&&x.length<64):[];
 const dates=[...(prior.question.match(/\b(?:19|20)\d{2}\b/g)||[])].slice(0,3);
 const parts=[];
 if(selected.length)parts.push("Oldingi tanlangan nomlar / Ранее выбранные названия: "+selected.join("; "));
 if(codes.length)parts.push("Oldingi identifikatorlar / Ранее выбранные коды: "+codes.join(", "));
 if(dates.length)parts.push("Oldingi davr / Предыдущий период: "+[...new Set(dates)].join(", "));
 if(!parts.length)return q.slice(0,1500);
 const prefix=parts.join(". ")+".\n";
 return prefix.slice(0,Math.max(0,1500-q.length))+q.slice(0,1500);
}
function renderReply(r,time,originalQuestion,sourceChat){const t=words[lang];const noValues=r.status==="ok"&&(!r.rows.length||r.rows.every(v=>Object.values(v).every(x=>x==null)));
 // Fixed errors are always localized synchronously; successful past responses
 // use cached Gemini display translations (and NEVER mutate their SQL values).
 const canned = r.status==="unavailable" ? t.unavailable :
                r.status==="provider_error" ? t.provider :
                r.status==="error" ? t.retry : null;
 const translated=localized(r),needTranslate=["ok","clarify"].includes(r.status)&&r.lang!==lang;
 const displayed = noValues?t.empty:
    (canned||(needTranslate?(translated?.answer||(sourceChat.turns.find(v=>v.result===r)?.translationFailed===lang?t.translationError:t.translating)):(r.error||r.answer||t.error)));
 const {wrap,content,bubble}=row("ai",displayed,time,(noValues||["unavailable","error","provider_error"].includes(r.status))?"no-data":"");
 if(r.status==="ok"&&r.sql&&Array.isArray(r.source)&&r.source.length){
  const proof=node("div","evidence");proof.append(node("div","source-badge","✓ "+t.source+" · "+r.source.join(", ")));
  if(r.display_format!=="text" && (r.rows.length>1||(r.rows.length>0&&r.columns.length>1)))proof.append(table(r));
  if(r.truncated)proof.append(node("p","note",t.cap));const d=node("details");d.append(node("summary","",t.sql),node("p","",r.note),node("pre","",r.sql));
  if(r.check_sql)d.append(node("p","",t.check),node("pre","",r.check_sql));proof.append(d);bubble.after(proof)
 }
 if(r.suggest_new_chat || ["error","provider_error"].includes(r.status)){
   const hint=node("p","note",t.newChatHint),btn=node("button","action-chip",t.tryFresh);
   btn.type="button";
   btn.onclick=()=>{
      // Capture the question belonging to THIS error bubble, not whatever
      // happens to be the newest question in the currently selected chat.
      const q=prepareFreshQuestion(originalQuestion||"",sourceChat);
      const c=makeChat();chats.unshift(c);choose(c);
      input.value=q;c.draft=q;resize();controls();save();input.focus();
   };
   content.append(hint,btn);
 }
 return wrap}
function renderMessages(animate=false){const m=$("messages");m.replaceChildren();m.append(row("ai",words[lang].welcome).wrap);
 for(const turn of active.turns){m.append(row("user",turn.question,turn.at).wrap);
 if(turn.result)m.append(renderReply(turn.result,turn.done,turn.question,active));else if(busy.has(active.id)){const w=row("ai","");w.bubble.classList.add("pending");
 const dots=node("span","dots");dots.setAttribute("aria-hidden","true");dots.append(node("i"),node("i"),node("i"));w.bubble.append(dots,node("span","",words[lang].wait));m.append(w.wrap)}
 else m.append(row("ai",words[lang].network,null,"no-data").wrap)}
 if(animate&&m.lastElementChild){m.lastElementChild.classList.add("arrive");if(busy.has(active.id))m.lastElementChild.previousElementSibling?.classList.add("arrive")}
 m.scrollTop=m.scrollHeight}
function resize(){input.style.height="auto";input.style.height=Math.min(120,Math.max(32,input.scrollHeight))+"px"}
function controls(){const t=words[lang];$("sendBtn").disabled=busy.has(active.id)||!input.value.trim();$("sendBtn").title=t.send;$("sendBtn").setAttribute("aria-label",t.send);input.placeholder=t.hint;input.setAttribute("aria-label",t.hint)}
function refresh(animate=false){const t=words[lang];document.documentElement.lang=lang;document.querySelectorAll("[data-t]").forEach(n=>n.textContent=t[n.dataset.t]);$("coverage").textContent=coverage.join(" — ");
 $("menu").setAttribute("aria-label",t.menu);for(const l of ["uz","ru"])$(l).setAttribute("aria-pressed",String(l===lang));
 const chips=$("chips");chips.replaceChildren();t.chips.forEach((label,i)=>{const b=node("button","action-chip");b.type="button";b.append(icon(["chart","brokers","rate","doc"][i]),node("span","",label));
 b.onclick=()=>{input.value=t.prompts[i];input.focus();resize();controls()};chips.append(b)});menuList();renderMessages(animate);controls();translateVisible()}
$("newChat").onclick=()=>{if(!active.turns.length){drawer(false);input.focus();return}const c=makeChat();chats.unshift(c);choose(c)};
$("menu").onclick=()=>drawer(true);$("backdrop").onclick=()=>drawer(false);document.addEventListener("keydown",e=>{if(e.key==="Escape")drawer(false)});
for(const l of ["uz","ru"])$(l).onclick=()=>{lang=l;for(const turn of active.turns)delete turn.translationFailed;refresh();save()};
input.oninput=()=>{active.draft=input.value;resize();controls()};
input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("form").requestSubmit()}};
$("form").onsubmit=async e=>{e.preventDefault();const c=active,question=input.value.trim();if(!question||busy.has(c.id))return;
 const conversation=c.turns.filter(v=>v.result&&["ok","clarify","unavailable"].includes(v.result.status)).slice(-12).map(v=>({question:v.question,reply:(v.result.answer||"").slice(0,1500),prior_sql:(v.result.sql||"").slice(0,1500),selected_set:v.result.selected_set||[],state:v.result.state||{}}));
 const requestLang=lang;const turn={question,lang:requestLang,at:Date.now()};c.turns.push(turn);c.draft="";busy.add(c.id);input.value="";resize();refresh(true);save();
 try{const resp=await fetch("/api/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question,lang:requestLang,conversation})});
 const r=await resp.json();
 const currentText=words[requestLang];
 turn.result=resp.ok?{...r,lang:r.lang||requestLang}:{status:r.status||"error",lang:requestLang,error:resp.status===429?currentText.limit:resp.status===503||resp.status===504?currentText.provider:currentText.retry,suggest_new_chat:!!r.suggest_new_chat || [422,503,504].includes(resp.status)};
 }catch(err){turn.result={status:"error",lang:requestLang,error:words[requestLang].network,suggest_new_chat:true}}finally{turn.done=Date.now();busy.delete(c.id);save();if(active===c){renderMessages(true);controls();translateVisible()}}};
input.value=active.draft||"";refresh();fetch("/health").then(r=>r.json()).then(h=>{coverage=h.coverage||[];$("coverage").textContent=coverage.join(" — ")}).catch(()=>{});
</script></body></html>
